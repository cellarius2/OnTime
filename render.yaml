services:
  - type: web
    name: ontime-api
    runtime: docker
    rootDir: OnTime.API
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "1"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Cors__AllowedOrigins
        sync: false
      - key: N8n__ChatWebhookUrl
        sync: false
      - key: N8n__ReminderMessageWebhookUrl
        sync: false
      - key: JonasAi__Provider
        value: N8n
      - key: JonasAi__OllamaUrl
        sync: false
      - key: JonasAi__Model
        value: deepseek-r1:8b
      - key: JonasAi__TimeoutSeconds
        value: "300"
      - key: JonasAi__ReminderTimeoutSeconds
        value: "45"
      - key: JonasAi__DispatchToken
        sync: false
      - key: Swagger__Enabled
        value: "true"
      - key: Database__MigrateOnStartup
        value: "false"
